name: yahoo-watcher
on:
  workflow_dispatch:
  schedule:
    - cron: '5 19 * * *'   # 04:05 JST
    - cron: '5 1 * * *'    # 10:05 JST
    - cron: '5 6 * * *'    # 15:05 JST
    - cron: '5 8 * * *'    # 17:05 JST
jobs:
  yahoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests gspread google-auth tzdata
      - run: python yahoo_watcher.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
